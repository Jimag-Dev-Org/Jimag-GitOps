apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-db-seed
  namespace: dev
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          # 🔹 Use the same image + tag you use for inventory-svc
          image: 329551316753.dkr.ecr.us-east-1.amazonaws.com/jimag-dev-inventory-svc:dev-fcb15c85e0aefc30bc55ed824a8a5e749cc465fe
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: DATABASE_URL
          
          command: [ "sh", "-c" ]
          args:
            - |
              echo "Running Prisma migrate deploy..."
              npx prisma migrate deploy

              echo "Running Prisma seed..."
              npx tsx prisma/seed.ts