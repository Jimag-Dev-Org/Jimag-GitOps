apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-db-seed
  namespace: dev
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          # 🔹 Use the same image + tag you use for inventory-svc
          image: 329551316753.dkr.ecr.us-east-1.amazonaws.com/jimag-dev-inventory-svc:dev-fcb15c85e0aefc30bc55ed824a8a5e749cc465fe
          imagePullPolicy: IfNotPresent
          envFrom:
            # reuse the exact same env as your deployment so DATABASE_URL is correct
            - secretRef:
                name: inventory-db
          command: [ "sh", "-c" ]
          args:
            - >
              echo "Running Prisma migrate + seed..." &&
              npx prisma migrate deploy &&
              npx prisma db seed &&
              echo "✅ Seed complete"
