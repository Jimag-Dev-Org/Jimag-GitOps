apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-svc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  template:
    spec:
      containers:
        - name: inventory-svc
          image: 329551316753.dkr.ecr.us-east-1.amazonaws.com/jimag-dev-inventory-svc:dev-PLACEHOLDER

          envFrom:
            - configMapRef:
                name: inventory-svc-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: DATABASE_URL