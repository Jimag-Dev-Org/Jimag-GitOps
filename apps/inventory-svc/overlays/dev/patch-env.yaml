apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-svc
  metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  template:
    spec:
      containers:
        - name: inventory-svc
          image: 329551316753.dkr.ecr.us-east-1.amazonaws.com/jimag-dev-inventory-svc:dev-PLACEHOLDER
          env:
            - name: NODE_ENV
              value: "development"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: DATABASE_URL  
