apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-svc
  template:
    metadata:
      labels:
        app: inventory-svc
    spec:
      containers:
        - name: inventory-svc
          # Image will be overridden in dev overlay for now
          image: 329551316753.dkr.ecr.us-east-1.amazonaws.com/jimag-dev-inventory-svc:dev-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"  # base default; dev overlay can override
            # DATABASE_URL (or similar) will be added later once we wire secrets properly
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
